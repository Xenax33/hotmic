[workspace]
resolver = "2"
members = ["crates/hotmic-core", "crates/hotmic-cli", "crates/hotmic-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Xenax33/hotmic"

# Debug builds keep our crates debuggable but optimise dependencies, otherwise decoding and
# resampling in symphonia/rubato are 10 to 20 times slower than release.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
cpal = "0.18"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "ogg", "vorbis", "flac", "isomp4", "aac", "pcm", "adpcm"] }
rubato = "5"
rtrb = "0.3"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
