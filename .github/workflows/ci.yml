name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and test the engine
        run: cargo test -p hotmic-core -p hotmic-cli
      - name: Check the app compiles
        run: cargo check -p hotmic-app
