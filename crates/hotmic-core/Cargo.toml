[package]
name = "hotmic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Audio engine for Hotmic: mic passthrough plus clip mixing into a virtual cable"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
cpal.workspace = true
symphonia.workspace = true
rubato.workspace = true
rtrb.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
# yt-dlp installer: fetches the exe and its checksum file from GitHub releases.
reqwest = { version = "0.12", features = ["blocking"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# Media Foundation fallback decoder: HE-AAC, WMA and anything else Windows can play.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
